name: ToolHubMobile
options:
  bundleIdPrefix: com.yxp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  ToolHub:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yxp.toolhub
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: ToolHub
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 连接你选择的服务器，获取工具并执行操作。
        NSPhotoLibraryAddUsageDescription: 将你选择的照片、生成图片和视频成果保存到系统相册。
        NSMicrophoneUsageDescription: 为语音训练录制并上传你选择的语音。
        NSCameraUsageDescription: 拍摄需要发送给扫描或图像工具的照片。
        CFBundleURLTypes:
          - CFBundleURLName: com.yxp.toolhub.connect
            CFBundleURLSchemes: [toolhub]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false

  ToolHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ToolHub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ToolHub:
    build:
      targets:
        ToolHub: all
    test:
      targets:
        - ToolHubTests
